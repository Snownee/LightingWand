plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

version = "mc${archive_minecraft_version}-NeoForge-${mod_version}"
group = project.maven_group
var realVersion = project.mod_version + '+neoforge'

base {
    archivesName = project.archives_base_name
}

neoForge {
    // We currently only support NeoForge versions later than 21.0.x
    // See https://projects.neoforged.net/neoforged/neoforge for the latest updates
    version = project.loader_version

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            clientData()
            programArguments = ['--mod', project.mod_id, '--all', '--output', project.file('src/generated/resources').absolutePath]
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://jitpack.io" }

    // JEI
    maven { url "https://modmaven.dev" }
    maven { url "https://dvs1.progwml6.com/files/maven/" }

    // LambDynamicLights
    maven {
        name = "Gegy"
        url = uri("https://maven.gegy.dev")
    }

    maven { url "https://api.modrinth.com/maven" }
    flatDir { dir 'libs' }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    api("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")

//    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
//    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"

    // compile against the JEI API but do not include it at runtime
    compileOnlyApi "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnlyApi "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // https://modrinth.com/mod/jade/versions
    runtimeOnly "maven.modrinth:jade:${jade_version}+neoforge"

    // https://modrinth.com/mod/kiwi/versions
    implementation(annotationProcessor("maven.modrinth:kiwi:26.0.18+neoforge"))
//    implementation(annotationProcessor(files("libs/Kiwi-mc26.1.2-NeoForge-26.0.6.jar")))

    // https://modrinth.com/mod/shimmer!/versions
//    modImplementation "maven.modrinth:uBKACKpl:zh7cZkGa"

//    runtimeOnly "maven.modrinth:mekanism:10.7.13.78"

    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynamiclights_version}")
//    runtimeOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${project.lambdynamiclights_version}")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs.add("-Akiwi.useDataModule")
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : realVersion,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*.bat'
    exclude("/assets/${project.mod_id}/lang/en_us.existing.json")
}

java {
//    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("neoforge")
    displayName = "[NeoForge ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "296028"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("26.1")
        requires("kiwi")
        optional("cloth-config")
    }
    modrinth {
        projectId = "lak1V0eP"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("26.1")
        requires("kiwi")
        optional("cloth-config")
    }
}